<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledgerline</title>
<meta name="description" content="Ledgerline: invoicing for freelancers. Income, unpaid invoices and cash flow at a glance.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<script>
  /* Before first paint: theme, page and view come from the query string so review links never flash. */
  (function () {
    var q = new URLSearchParams(location.search), root = document.documentElement;
    if (q.get("theme") === "light" || q.get("theme") === "dark") root.dataset.theme = q.get("theme");
    if (q.get("view") === "empty" || q.get("view") === "loading") root.dataset.view = q.get("view");
  })();
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></symbol>
  <symbol id="i-doc" viewBox="0 0 16 16"><path d="M4 1.5h5l3 3v10H4zM9 1.5v3h3M6.5 8.5h3M6.5 11h3"/></symbol>
  <symbol id="i-users" viewBox="0 0 16 16"><circle cx="6" cy="5.5" r="2.25"/><path d="M2 13.5c.4-2.2 2-3.5 4-3.5s3.6 1.3 4 3.5M10.5 3.5a2.25 2.25 0 0 1 0 4.25M12 10.25c1.1.5 1.8 1.6 2 3.25"/></symbol>
  <symbol id="i-receipt" viewBox="0 0 16 16"><path d="M3.5 1.5h9v13l-2-1.25-2.5 1.25-2.5-1.25-2 1.25zM6 5h4M6 7.75h4M6 10.5h2"/></symbol>
  <symbol id="i-bars" viewBox="0 0 16 16"><path d="M2 13.5h12M4.5 11V8M8 11V4M11.5 11V6.5"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 16 16"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.25"/><path d="M10.25 10.25l3.25 3.25"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></symbol>
  <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.75"/><path d="M8 1.5v1.25M8 13.25v1.25M1.5 8h1.25M13.25 8h1.25M3.4 3.4l.9.9M11.7 11.7l.9.9M3.4 12.6l.9-.9M11.7 4.3l.9-.9"/></symbol>
  <symbol id="i-moon" viewBox="0 0 16 16"><path d="M13.25 9.6A5.5 5.5 0 0 1 6.4 2.75a5.5 5.5 0 1 0 6.85 6.85z"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
  <symbol id="i-more" viewBox="0 0 16 16"><path d="M3.5 8h.01M8 8h.01M12.5 8h.01" stroke-width="2"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 16 16"><path d="M3.5 8h9M9 4.5L12.5 8 9 11.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6.5 4l4 4-4 4"/></symbol>
  <symbol id="i-in" viewBox="0 0 16 16"><path d="M8 2.5v8M4.75 7.5L8 10.75l3.25-3.25M3 13.25h10"/></symbol>
  <symbol id="i-alert" viewBox="0 0 16 16"><path d="M8 2.25L1.75 13.25h12.5zM8 6.5v3M8 11.5h.01"/></symbol>
  <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.75"/><path d="M8 4.75V8l2.25 1.5"/></symbol>
  <symbol id="i-pie" viewBox="0 0 16 16"><path d="M8 2.25A5.75 5.75 0 1 0 13.75 8H8z"/><path d="M10 1.5a4.5 4.5 0 0 1 4.5 4.5H10z"/></symbol>
  <symbol id="i-hourglass" viewBox="0 0 16 16"><path d="M4 1.75h8M4 14.25h8M5 1.75c0 3 6 3.5 6 6.25S5 11.25 5 14.25M11 1.75c0 3-6 3.5-6 6.25s6 3.25 6 6.25"/></symbol>
  <symbol id="i-send" viewBox="0 0 16 16"><path d="M14 2L7 9M14 2l-4.5 12L7 9 2 6.5z"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></symbol>
  <symbol id="i-pen" viewBox="0 0 16 16"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 16 16"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1.5H3zM6.5 12.5a1.5 1.5 0 0 0 3 0"/></symbol>
  <symbol id="i-up" viewBox="0 0 12 12"><path d="M6 9.5v-7M3 5.5l3-3 3 3"/></symbol>
  <symbol id="i-dn" viewBox="0 0 12 12"><path d="M6 2.5v7M3 6.5l3 3 3-3"/></symbol>
  <symbol id="i-sort" viewBox="0 0 12 12"><path d="M6 2.5v7M3 6.5l3 3 3-3"/></symbol>
  <!-- Status glyphs: a different shape per state, so colour is never the only signal. -->
  <symbol id="g-paid" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25"/><path d="M5.25 8.25l1.9 1.9 3.6-4"/></symbol>
  <symbol id="g-overdue" viewBox="0 0 16 16"><path d="M8 1.75l6.25 6.25L8 14.25 1.75 8z"/><path d="M8 5.25v3.25M8 10.75h.01"/></symbol>
  <symbol id="g-draft" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" stroke-dasharray="2.5 2.4"/></symbol>
</svg>

<div class="app">
  <aside class="side" aria-label="Sidebar">
    <div class="brand">
      <span class="brand__mark"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M4 10h7M4 14h12"/><path d="M13.5 8.5l1.5 1.5 2.5-3" stroke-width="1.75"/></svg></span>
      <span class="brand__name"><b>Ledgerline</b><span id="studio-name">Noa Brennan Studio</span></span>
    </div>
    <nav class="nav" aria-label="Money">
      <p class="nav__label" aria-hidden="true">Money</p>
      <a class="nav__item" href="?page=overview" data-page="overview" title="Overview"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span class="t">Overview</span></a>
      <a class="nav__item" href="?page=invoices" data-page="invoices" title="Invoices"><svg class="icon" aria-hidden="true"><use href="#i-doc"/></svg><span class="t">Invoices</span><span class="count count--warn" id="nav-overdue"></span></a>
      <button class="nav__item" type="button" aria-disabled="true" title="Clients is not part of this build"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg><span class="t">Clients</span><span class="count" id="nav-clients"></span></button>
      <button class="nav__item" type="button" aria-disabled="true" title="Expenses is not part of this build"><svg class="icon" aria-hidden="true"><use href="#i-receipt"/></svg><span class="t">Expenses</span></button>
      <button class="nav__item" type="button" aria-disabled="true" title="Reports is not part of this build"><svg class="icon" aria-hidden="true"><use href="#i-bars"/></svg><span class="t">Reports</span></button>
    </nav>
    <nav class="nav" aria-label="Account">
      <p class="nav__label" aria-hidden="true">Account</p>
      <button class="nav__item" type="button" aria-disabled="true" title="Settings is not part of this build"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span class="t">Settings</span></button>
    </nav>
    <section class="usage" id="usage" aria-labelledby="usage-h" hidden></section>
    <div class="me">
      <span class="avatar" style="--c: var(--accent)" aria-hidden="true">NB</span>
      <span class="me__name"><b>Noa Brennan</b><span>Product designer</span></span>
    </div>
  </aside>

  <div class="col">
    <header class="top" id="top">
      <span class="top__brand"><span class="brand__mark"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M4 10h7M4 14h12"/><path d="M13.5 8.5l1.5 1.5 2.5-3" stroke-width="1.75"/></svg></span>Ledgerline</span>
      <p class="crumbs">Noa Brennan Studio <span aria-hidden="true">/</span> <b id="crumb">Overview</b></p>
      <label class="search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Search invoices or clients" aria-label="Search invoices" aria-keyshortcuts="Meta+K Control+K" autocomplete="off">
        <kbd aria-hidden="true">⌘K</kbd>
      </label>
      <button class="btn btn--quiet btn--icon theme-btn" type="button" id="theme-btn" aria-label="Switch theme"><svg class="icon i-moon" aria-hidden="true"><use href="#i-moon"/></svg><svg class="icon i-sun" aria-hidden="true"><use href="#i-sun"/></svg></button>
      <button class="btn btn--primary" type="button" id="new-invoice"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span class="t">New invoice</span></button>
    </header>

    <main class="main" id="main">
      <p class="sr-only" role="status" aria-live="polite" id="live"></p>

      <!-- Overview -->
      <section class="page" id="page-overview" aria-labelledby="ov-h">
        <header class="head">
          <div>
            <h1 id="ov-h">Overview</h1>
            <p class="head__sub" id="ov-sub"></p>
          </div>
          <ul class="chips" id="chips" aria-label="Needs attention"></ul>
        </header>
        <div class="grid draw" id="ov-grid">
          <article class="tile kpi c3" data-skel="kpi" id="k-income"></article>
          <article class="tile kpi c3" data-skel="kpi" id="k-out" style="--c: var(--chart-1)"></article>
          <article class="tile kpi c3" data-skel="kpi" id="k-overdue" style="--c: var(--danger)"></article>
          <article class="tile kpi c3" data-skel="kpi" id="k-days" style="--c: var(--success)"></article>

          <section class="tile c8" data-skel="chart" id="cashflow" aria-labelledby="cf-h"></section>
          <section class="tile mix c4" data-skel="mix" id="mix" aria-labelledby="mix-h"></section>

          <section class="tile c8" data-skel="table" id="recent" aria-labelledby="rec-h"></section>
          <div class="stack c4">
            <section class="tile" data-skel="week" id="week" aria-labelledby="week-h"></section>
            <section class="tile" data-skel="age" id="ageing" aria-labelledby="age-h"></section>
          </div>
        </div>
      </section>

      <!-- Invoices -->
      <section class="page" id="page-invoices" aria-labelledby="inv-h" hidden>
        <header class="head">
          <div>
            <h1 id="inv-h">Invoices</h1>
            <p class="head__sub" id="inv-sub"></p>
          </div>
        </header>
        <div class="tile" data-skel="band" id="band"></div>
        <section class="tile" data-skel="table" aria-label="Invoice list">
          <div class="toolbar">
            <div class="tabs" role="tablist" aria-label="Filter by status" id="tabs">
              <span class="tabs__thumb" aria-hidden="true"></span>
            </div>
            <p class="toolbar__meta" id="tbl-meta" aria-live="polite"></p>
          </div>
          <div class="tbl-wrap" role="tabpanel" id="inv-panel" aria-labelledby="tab-all"></div>
        </section>
      </section>
    </main>
  </div>
</div>

<nav class="tabbar" aria-label="Primary">
  <a class="nav__item" href="?page=overview" data-page="overview"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>Overview</a>
  <a class="nav__item" href="?page=invoices" data-page="invoices"><svg class="icon" aria-hidden="true"><use href="#i-doc"/></svg>Invoices<span class="count count--warn" id="tb-overdue"></span></a>
  <button class="nav__item" type="button" aria-disabled="true" title="Clients is not part of this build"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg>Clients</button>
  <button class="nav__item" type="button" aria-disabled="true" title="Expenses is not part of this build"><svg class="icon" aria-hidden="true"><use href="#i-receipt"/></svg>Expenses</button>
  <button class="nav__item" type="button" aria-disabled="true" title="More is not part of this build"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg>More</button>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-h"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
